    <title>BALISOFT TimeKeeping</title>
    <script>
      try {
        const t = localStorage.getItem('balisoft-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch {}
    </script>
